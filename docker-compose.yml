# Local full-stack: Postgres + backend (uvicorn) + web (nginx single-origin).
# Browse the app at http://localhost:8080
#
# Needs POSTGRES_PASSWORD — Compose reads it from a git-ignored root `.env`
# (see .env.example). It must match the password in backend/.env.docker's
# DATABASE_URL.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ncplusplus_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a root .env}
      POSTGRES_DB: ncplusplus_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncplusplus_user -d ncplusplus_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ncplusplus-backend         # tag it so `worker` can reuse the same image
    env_file: ./backend/.env.docker   # DATABASE_URL host is `db`, not localhost
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"                        # only the web proxy needs to reach it
    # The entrypoint runs `alembic upgrade head` before uvicorn, so the backend
    # only reports healthy once migrations are applied. `worker` waits on that.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Training executor — the SAME image as `backend`, run as a background claim
  # loop instead of the API (App Runner CPU-throttles background work, so in prod
  # this lives on separate always-on compute; locally it's just another service).
  # Scale freely: `docker compose up --scale worker=3` is safe — the worker
  # claims jobs with SELECT ... FOR UPDATE SKIP LOCKED, so no two ever collide.
  worker:
    # Same build + image tag as `backend`, so this is the one shared image (built
    # once; the second build is a full cache hit). The build section is required:
    # with only `image:`, `compose up` tries to PULL ncplusplus-backend from a
    # registry — where it doesn't exist — and fails "pull access denied".
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ncplusplus-backend
    # Override the migrate-then-uvicorn entrypoint: this process is the worker,
    # not the API, and migrations run once via `backend`. Overriding entrypoint
    # in Compose also clears the image's uvicorn CMD.
    entrypoint: ["python", "-m", "backend.worker"]
    env_file: ./backend/.env.docker
    depends_on:
      backend:
        condition: service_healthy    # i.e. after migrations have run
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""              # same-origin: SPA calls /auth, /users, ...
    environment:
      PORT: "80"
      BACKEND_URL: "http://backend:8000"  # service name = hostname on the network
    depends_on:
      - backend
    ports:
      - "8080:80"                     # host 8080 -> nginx 80

volumes:
  pgdata:
