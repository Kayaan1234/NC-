# Local full-stack: Postgres + app (single-origin nginx+uvicorn) + worker.
# Browse the app at http://localhost:8080
#
# Needs POSTGRES_PASSWORD — Compose reads it from a git-ignored root `.env`
# (see .env.example). It must match the password in backend/.env.docker's
# DATABASE_URL.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ncplusplus_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a root .env}
      POSTGRES_DB: ncplusplus_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncplusplus_user -d ncplusplus_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-origin front door: nginx serves the SPA and reverse-proxies the API to
  # uvicorn in the SAME container (127.0.0.1:8000). One image, one public port.
  # The entrypoint runs `alembic upgrade head` before serving, so the app only
  # reports healthy once migrations are applied — `worker` waits on that.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_URL: ""              # same-origin: SPA calls /auth, /users, ...
    image: ncplusplus-web
    env_file: ./backend/.env.docker   # DATABASE_URL host is `db`, not localhost
    environment:
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"                   # host 8080 -> nginx (which proxies uvicorn)
    healthcheck:
      # Hit the health route THROUGH nginx so the whole proxy path is exercised.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Training executor + email-outbox drain. SEPARATE always-on process (App Runner
  # CPU-throttles background work, so in prod this is Fargate). Uses the lean
  # `worker` image target (python + the training binaries, no nginx/SPA). Scale
  # freely: `docker compose up --scale worker=3` is safe — jobs are claimed with
  # SELECT ... FOR UPDATE SKIP LOCKED, so no two workers ever collide.
  #
  # mem_limit mirrors the >=1GB the deployed task needs. Step1's MNIST loader
  # materialises the whole idx file as doubles before applying --limit, so any
  # MNIST run peaks near 500MB; the limit is here so a local run that overshoots
  # gets OOM-killed in the container instead of swapping the host.
  worker:
    mem_limit: 1500m
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: ncplusplus-worker
    env_file: ./backend/.env.docker
    depends_on:
      app:
        condition: service_healthy    # i.e. after migrations have run
    restart: unless-stopped

  # Throwaway Postgres for the test suite. Started on its own, never as part of
  # the app stack:
  #
  #     docker compose up -d db-test
  #     export TEST_DATABASE_URL=postgresql+psycopg://ncplusplus_user:test@localhost:55432/ncplusplus_test
  #     pytest -m "not e2e"
  #
  # Three differences from `db`, all deliberate:
  #   * a published host port, because pytest runs on the host, not in the network;
  #   * a tmpfs rather than a named volume, so the data dies with the container —
  #     the suite TRUNCATEs everything between tests anyway, and nothing here is
  #     worth persisting;
  #   * `profiles`, so `docker compose up` for normal development does NOT start it.
  #
  # The database name must end in `_test`; the suite's root conftest.py refuses to
  # run against anything else, which is what stops it truncating a real database.
  # POSTGRES_USER owns the created database, without which TRUNCATE is denied.
  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ncplusplus_user
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ncplusplus_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "55432:5432"                  # non-default, so it can't collide with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncplusplus_user -d ncplusplus_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
