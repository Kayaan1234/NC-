[pytest]
# Run from the repo root so `import backend...` resolves.
testpaths = backend/tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    e2e: full user journeys driven in-process against the test database. Slower;
        excluded from the per-push CI job and run on a nightly schedule.
    requires_binary: needs a compiled Step0/Step1 `nn`. Those are gitignored and
        absent in CI, so these skip unless the binary is actually present.
filterwarnings =
    # Turn anything we haven't explicitly excused into a failure, so a real
    # deprecation in our own code can't hide in the summary.
    error
    # Library-internal: Starlette's TestClient importing httpx. Not our code, and
    # note the class is StarletteDeprecationWarning — matching on
    # DeprecationWarning does not catch it.
    ignore:Using `httpx` with `starlette.testclient`
    # OUR CODE, and a real (if harmless) deprecation the suite surfaced:
    # backend/routers/train.py:166 uses status.HTTP_422_UNPROCESSABLE_ENTITY,
    # which Starlette renamed to HTTP_422_UNPROCESSABLE_CONTENT. Both are 422, so
    # nothing is broken today, but the old name will eventually be removed.
    # Delete this line once train.py is updated — it is the only occurrence.
    ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated
