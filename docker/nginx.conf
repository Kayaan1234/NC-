# Main nginx config for the single-origin container. Runs entirely in user space
# (non-root): pid + temp paths under /tmp, logs to stdout/stderr, and no `user`
# directive, so workers inherit the non-root user that launches nginx.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Default temp/scratch paths live under /var and need root; move them to /tmp
    # so a non-root master can write them.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile        on;
    keepalive_timeout 65;

    # Response compression. nginx fronts EVERYTHING here (static SPA + proxied API
    # JSON), so gzip lives once, in nginx, and stays off the CPU-throttled app
    # tier — no app-side GZipMiddleware needed.
    gzip              on;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # The server block (rendered from the template with $PORT at start-up).
    include /etc/nginx/conf.d/*.conf;
}
